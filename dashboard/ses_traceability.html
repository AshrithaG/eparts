<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SES Traceability</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0c0f14;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  svg {
    width: min(920px, 100%);
    height: auto;
    max-height: calc(100vh - 40px);
  }
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" aria-hidden="true" role="presentation">
    <defs>
      <marker id="mk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
        <polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/>
      </marker>
      <marker id="mkAccent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
        <polygon points="0 0, 9 3.5, 0 7" fill="#34d399"/>
      </marker>
    </defs>

    <!-- Left: ingress as one subdivided panel -->
    <rect x="24" y="58" width="112" height="164" rx="12" fill="#151c28" stroke="#334155" stroke-width="1.5"/>
    <line x1="24" y1="114" x2="136" y2="114" stroke="#334155" stroke-opacity="0.6"/>
    <line x1="24" y1="168" x2="136" y2="168" stroke="#334155" stroke-opacity="0.6"/>
    <text x="80" y="96" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="13" font-weight="650" text-anchor="middle">meeting</text>
    <text x="80" y="148" fill="#fdba74" font-family="system-ui,sans-serif" font-size="13" font-weight="650" text-anchor="middle">concern</text>
    <text x="80" y="202" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5" font-weight="650" text-anchor="middle">coach_session</text>

    <!-- Left → REQ -->
    <line x1="136" y1="140" x2="218" y2="140" stroke="#64748b" stroke-width="2.75" marker-end="url(#mkAccent)"/>

    <!-- Requirement -->
    <rect x="222" y="96" width="156" height="88" rx="14" fill="rgba(16,185,129,0.13)" stroke="#34d399" stroke-width="2.25"/>
    <text x="300" y="136" fill="#ecfdf5" font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle">requirement</text>
    <text x="300" y="162" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">REQ-XXX</text>

    <!-- REQ → design stack -->
    <line x1="378" y1="140" x2="446" y2="140" stroke="#64748b" stroke-width="2.75" marker-end="url(#mkAccent)"/>

    <rect x="450" y="58" width="128" height="164" rx="12" fill="#151c28" stroke="#475569" stroke-width="1.5"/>
    <line x1="450" y1="140" x2="578" y2="140" stroke="#334155" stroke-opacity="0.5"/>
    <text x="514" y="102" fill="#fde047" font-family="system-ui,sans-serif" font-size="12.5" font-weight="650" text-anchor="middle">decision</text>
    <text x="514" y="206" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="12.5" font-weight="650" text-anchor="middle">architecture</text>

    <!-- Design → right stack -->
    <line x1="578" y1="102" x2="656" y2="102" stroke="#64748b" stroke-width="2" marker-end="url(#mk)" opacity="0.9"/>
    <line x1="578" y1="206" x2="656" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#mk)" opacity="0.9"/>
    <path d="M 514 120 L 514 174" stroke="#475569" stroke-width="1.5"/>

    <!-- Right: backlog + risk -->
    <rect x="660" y="66" width="116" height="72" rx="11" fill="rgba(13,148,136,0.12)" stroke="#14b8a8" stroke-width="1.5"/>
    <text x="718" y="109" fill="#99f6e4" font-family="system-ui,sans-serif" font-size="12.5" font-weight="650" text-anchor="middle">jira_ticket</text>

    <rect x="668" y="174" width="100" height="48" rx="10" fill="#151c28" stroke="#ef4444" stroke-width="1.5"/>
    <text x="718" y="205" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="12.5" font-weight="650" text-anchor="middle">risk</text>

    <path d="M 718 138 L 718 170" stroke="#64748b" stroke-width="1.75" marker-end="url(#mk)" opacity="0.8"/>
  </svg>
</body>
</html>
