:root {
  --bg: #0a0e17;
  --surface: #131a2b;
  --surface2: #1a2338;
  --border: #253352;
  --text: #e0e6f0;
  --text-dim: #8899b4;
  --accent: #4f8cff;
  --accent2: #00d68f;
  --warn: #ff6b6b;
  --orange: #ff9f43;
  --purple: #a855f7;
  --pink: #ec4899;
  --cyan: #22d3ee;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; }
.header { background: linear-gradient(135deg, #131a2b 0%, #1a1040 100%); padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .subtitle { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.stats-bar { display: flex; gap: 24px; }
.stat { text-align: center; }
.stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat .lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

.tabs { display: flex; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; }
.tab { padding: 14px 24px; font-size: 13px; font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.view { display: none; padding: 24px 32px; min-height: calc(100vh - 140px); }
.view.active { display: block; }

/* Knowledge Graph */
#graph-container { width: 100%; height: calc(100vh - 200px); border-radius: 12px; overflow: hidden; position: relative; }
#graph-svg { width: 100%; height: 100%; background: radial-gradient(ellipse at center, #0f1624 0%, #080c14 100%); }
.graph-legend { position: absolute; top: 16px; left: 16px; background: rgba(19,26,43,0.95); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; font-size: 12px; }
.legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
.graph-tooltip { position: absolute; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 300px; z-index: 10; }
.graph-tooltip.visible { opacity: 1; }
.graph-tooltip h4 { color: var(--accent); margin-bottom: 4px; }
.graph-tooltip p { color: var(--text-dim); line-height: 1.5; }

/* Goal Model */
.goal-tree { display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 40px 0; }
.goal-level { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
.goal-level-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 8px; text-align: center; width: 100%; }
.goal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; min-width: 220px; max-width: 280px; transition: all 0.2s; cursor: default; }
.goal-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,140,255,0.15); }
.goal-card.strategic { border-color: var(--purple); background: linear-gradient(135deg, #1a1040 0%, var(--surface) 100%); }
.goal-card.soft { border-color: var(--cyan); }
.goal-card.user { border-color: var(--accent2); }
.goal-card.functional { border-color: var(--accent); }
.goal-card.obstacle { border-color: var(--warn); background: rgba(255,107,107,0.05); }
.goal-card .tag { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
.goal-card.strategic .tag { background: var(--purple); color: #fff; }
.goal-card.soft .tag { background: rgba(34,211,238,0.2); color: var(--cyan); }
.goal-card.user .tag { background: rgba(0,214,143,0.2); color: var(--accent2); }
.goal-card.functional .tag { background: rgba(79,140,255,0.2); color: var(--accent); }
.goal-card.obstacle .tag { background: rgba(255,107,107,0.2); color: var(--warn); }
.goal-card h3 { font-size: 14px; margin-bottom: 4px; line-height: 1.4; }
.goal-card .desc { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.goal-connectors { width: 100%; text-align: center; color: var(--border); font-size: 24px; }

/* WBS */
.wbs-tree { padding: 20px 0; }
.wbs-node { margin-left: 24px; border-left: 2px solid var(--border); padding-left: 20px; }
.wbs-node:last-child { border-left-color: transparent; }
.wbs-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; position: relative; }
.wbs-item::before { content: ''; position: absolute; left: -22px; top: 50%; width: 20px; height: 2px; background: var(--border); }
.wbs-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.wbs-item .dot.done { background: var(--accent2); }
.wbs-item .dot.in_progress { background: var(--accent); animation: pulse 2s infinite; }
.wbs-item .dot.not_started { background: var(--text-dim); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.wbs-item .label { font-size: 14px; font-weight: 500; }
.wbs-item .status { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding: 2px 8px; border-radius: 4px; }
.wbs-item .status.done { background: rgba(0,214,143,0.15); color: var(--accent2); }
.wbs-item .status.in_progress { background: rgba(79,140,255,0.15); color: var(--accent); }
.wbs-item .status.not_started { background: rgba(136,153,180,0.15); color: var(--text-dim); }
.wbs-root { font-size: 18px; font-weight: 700; color: var(--accent); padding: 12px 0; }
.wbs-phase { font-size: 15px; font-weight: 600; color: var(--text); padding: 16px 0 8px 0; }

/* Agent Flow */
#flow-container { width: 100%; height: calc(100vh - 200px); }
#flow-svg { width: 100%; height: 100%; background: radial-gradient(ellipse at center, #0f1624 0%, #080c14 100%); border-radius: 12px; }

/* Traceability */
.trace-matrix { display: grid; gap: 2px; overflow-x: auto; }
.trace-cell { padding: 8px; font-size: 11px; min-width: 90px; text-align: center; border-radius: 4px; }
.trace-cell.header { background: var(--surface2); font-weight: 600; color: var(--text); font-size: 10px; }
.trace-cell.has-link { background: rgba(79,140,255,0.2); color: var(--accent); cursor: pointer; }
.trace-cell.has-link:hover { background: rgba(79,140,255,0.35); }
.trace-cell.empty { background: var(--surface); }
.trace-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
.trace-section h3 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }
.trace-table { width: 100%; border-collapse: collapse; }
.trace-table th { text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
.trace-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(37,51,82,0.5); }
.trace-table tr:hover td { background: rgba(79,140,255,0.05); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.badge.meeting { background: rgba(168,85,247,0.2); color: var(--purple); }
.badge.req { background: rgba(79,140,255,0.2); color: var(--accent); }
.badge.arch { background: rgba(0,214,143,0.2); color: var(--accent2); }
.badge.concern { background: rgba(255,107,107,0.2); color: var(--warn); }
.badge.event { background: rgba(255,159,67,0.2); color: var(--orange); }

/* Event Timeline */
.timeline { position: relative; padding: 0 0 0 40px; }
.timeline::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.tl-item { position: relative; margin-bottom: 20px; }
.tl-item::before { content: ''; position: absolute; left: -30px; top: 8px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg); }
.tl-item.action::before { border-color: var(--accent2); }
.tl-item.decision::before { border-color: var(--purple); }
.tl-item.concern::before { border-color: var(--warn); }
.tl-item .tl-time { font-size: 10px; color: var(--text-dim); }
.tl-item .tl-body { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-top: 4px; }
.tl-item .tl-body h4 { font-size: 13px; margin-bottom: 4px; }
.tl-item .tl-body p { font-size: 12px; color: var(--text-dim); }
</style>
</head>

// ===== KNOWLEDGE GRAPH (D3 Force) =====
let graphRendered = false;
function renderGraph() {
  graphRendered = true;
  const svg = d3.select('#graph-svg');
  const container = document.getElementById('graph-container');
  const W = container.clientWidth, H = container.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);

  const nodes = [];
  const links = [];
  const colorMap = { meeting: '#a855f7', requirement: '#4f8cff', architecture: '#00d68f', concern: '#ff6b6b', person: '#ff9f43' };

  // Meeting nodes
  Object.entries(DATA.meetings).forEach(([id, m]) => {
    nodes.push({ id, label: m.label, type: 'meeting', r: 18, color: colorMap.meeting, detail: `${m.date} — ${m.type}` });
  });

  // Requirement nodes
  DATA.requirements.forEach(r => {
    nodes.push({ id: r.id, label: r.label, type: 'requirement', r: 14, color: colorMap.requirement, detail: r.description });
  });

  // Architecture nodes
  DATA.architecture.forEach(a => {
    nodes.push({ id: a.id, label: a.label, type: 'architecture', r: 12, color: colorMap.architecture, detail: `Layer: ${a.layer}` });
  });

  // Concern nodes
  DATA.concerns.forEach(c => {
    nodes.push({ id: c.id, label: c.label, type: 'concern', r: 10 + c.sessions * 3, color: colorMap.concern, detail: `Severity: ${c.severity}, raised in ${c.sessions} sessions` });
  });

  // People nodes (subset)
  ['Hrishik', 'Ashritha', 'Jaivard', 'Arjun', 'Harsha (eParts)', 'David (eParts)'].forEach(p => {
    nodes.push({ id: 'P-' + p, label: p, type: 'person', r: 10, color: colorMap.person, detail: 'Team member' });
  });

  // Traceability links
  const nodeIds = new Set(nodes.map(n => n.id));
  DATA.traceability.forEach(t => {
    if (nodeIds.has(t.from) && nodeIds.has(t.to)) {
      links.push({
        source: t.from, target: t.to, type: t.type,
        color: t.type === 'threatens' ? '#ff6b6b' : t.type === 'implemented_by' ? '#00d68f' : '#4f8cff55',
        dash: t.type === 'threatens' ? '4,3' : null,
      });
    }
  });

  // People → Meeting links
  const meetingPeople = {
    'GMT20260122': ['Hrishik', 'Ashritha'],
    'GMT20260212': ['Hrishik', 'Ashritha'],
    'GMT20260226': ['Hrishik', 'Jaivard'],
    'GMT20260402': ['Hrishik', 'Ashritha', 'Jaivard', 'Arjun'],
    'GMT20260416': ['Hrishik', 'Ashritha', 'Arjun'],
    'GMT20260224-220446': ['Hrishik', 'Ashritha'],
    'GMT20260220-180425': ['Hrishik'],
    'GMT20260224-190023': ['Hrishik'],
    'GMT20260220-222907': ['Hrishik'],
  };
  Object.entries(meetingPeople).forEach(([mid, peeps]) => {
    peeps.forEach(p => {
      if (nodeIds.has(mid) && nodeIds.has('P-' + p)) {
        links.push({ source: 'P-' + p, target: mid, type: 'attended', color: '#ff9f4333' });
      }
    });
  });

  const g = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => d.r + 8));

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d => d.color)
    .attr('stroke-width', d => d.type === 'threatens' ? 2 : 1.5)
    .attr('stroke-dasharray', d => d.dash)
    .attr('opacity', 0.6);

  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d => d.color)
    .attr('stroke', '#fff')
    .attr('stroke-width', 1.5)
    .attr('opacity', 0.9);

  node.append('text')
    .text(d => d.label.length > 20 ? d.label.slice(0, 18) + '…' : d.label)
    .attr('text-anchor', 'middle')
    .attr('dy', d => d.r + 14)
    .attr('fill', '#8899b4')
    .attr('font-size', '10px')
    .attr('font-weight', '500');

  const tooltip = document.getElementById('graph-tooltip');
  node.on('mouseover', (e, d) => {
    tooltip.innerHTML = `<h4>${d.label}</h4><p>${d.detail}</p><p style="margin-top:4px;color:#4f8cff">${d.type}</p>`;
    tooltip.classList.add('visible');
    tooltip.style.left = (e.pageX + 12) + 'px';
    tooltip.style.top = (e.pageY - 20) + 'px';
    // Highlight connected
    link.attr('opacity', l => (l.source === d || l.target === d) ? 1 : 0.1);
    node.select('circle').attr('opacity', n => {
      if (n === d) return 1;
      const connected = links.some(l => (l.source === d && l.target === n) || (l.target === d && l.source === n));
      return connected ? 1 : 0.2;
    });
  }).on('mousemove', e => {
    tooltip.style.left = (e.pageX + 12) + 'px';
    tooltip.style.top = (e.pageY - 20) + 'px';
  }).on('mouseout', () => {
    tooltip.classList.remove('visible');
    link.attr('opacity', 0.6);
    node.select('circle').attr('opacity', 0.9);
  });

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}
renderGraph();

// ===== WBS =====
(function renderWBS() {
  const container = document.getElementById('wbs-tree');
  const wbs = DATA.wbs;

  function renderNode(node, depth) {
    let html = '';
    if (depth === 0) {
      html += `<div class="wbs-root">${node.label}</div>`;
    } else if (depth === 1) {
      html += `<div class="wbs-phase">${node.label}</div>`;
    } else {
      const status = node.status || 'not_started';
      html += `<div class="wbs-item">
        <div class="dot ${status}"></div>
        <span class="label">${node.label}</span>
        <span class="status ${status}">${status.replace('_', ' ')}</span>
      </div>`;
    }
    if (node.children) {
      html += '<div class="wbs-node">';
      node.children.forEach(c => { html += renderNode(c, depth + 1); });
      html += '</div>';
    }
    return html;
  }

  container.innerHTML = renderNode(wbs, 0);
})();
