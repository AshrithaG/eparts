<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pimsie Supreme · Tick Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <header
      id="readonlyBanner"
      class="hidden border-b border-amber-500 bg-slate-200 px-6 py-2 text-center text-sm font-semibold uppercase tracking-wide text-slate-800"
    >
      Read-only archive snapshot —
      <span id="snapshotLabelHint"></span>
      <button
        id="btnExitRo"
        type="button"
        class="ml-4 rounded bg-slate-800 px-3 py-1 text-xs font-semibold lowercase text-white"
      >
        Exit snapshot
      </button>
    </header>

    <div class="sticky top-0 z-40 border-b border-slate-200 bg-white shadow-sm">
      <div class="mx-auto flex max-w-[1760px] flex-wrap items-center gap-4 px-4 py-3">
        <div>
          <h1 class="text-lg font-bold text-slate-900">Tick Board · AAS</h1>
          <p id="subtitle" class="max-w-xl text-xs text-slate-500">
            Columns: backlog → demo. Shared state in
            <code class="rounded bg-slate-100 px-1">tick-board/data/board.json</code>.
            Shortcut help: <kbd class="rounded bg-slate-100 px-1">?</kbd>-style —
            <span class="whitespace-nowrap"><kbd>n</kbd> card</span>
            ·
            <kbd>/</kbd> search · <kbd>t</kbd> tick · <kbd>a</kbd> archive · Esc close
          </p>
        </div>
        <div id="throughputChart" class="ml-auto"></div>
        <div id="collisionBanner" class="w-full lg:w-auto lg:flex-1"></div>
        <div class="flex flex-shrink-0 flex-wrap items-center gap-2 lg:order-last">
          <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search…"
            class="w-40 rounded-full border border-slate-300 bg-slate-50 px-3 py-2 text-xs focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500"
          />
          <button id="btnAddCard" type="button" class="rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-700">
            Add card
          </button>
          <button id="btnExport" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium hover:bg-slate-50">
            Export CSV
          </button>
          <button id="btnTickPanel" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium hover:bg-slate-50">
            Tick panel
          </button>
          <button id="btnArchive" type="button" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-medium hover:bg-slate-50">
            Archive
          </button>
          <button id="btnOpenPat" type="button" class="rounded-lg border border-violet-200 bg-violet-50 px-3 py-2 text-xs font-medium text-violet-900 hover:bg-violet-100">
            GitHub sign-in
          </button>
          <button id="btnLogout" type="button" class="rounded-lg border border-slate-300 px-3 py-2 text-xs hover:bg-slate-50">
            Log out
          </button>
        </div>
      </div>
    </div>

    <div class="mx-auto flex max-w-[1760px] gap-3 px-2 py-6">
      <main class="flex-1 overflow-hidden">
        <div id="kanbanBoard" class="flex gap-4 overflow-x-auto pb-4"></div>
      </main>
      <aside
        id="tickPanel"
        class="sticky top-[88px] hidden h-[calc(100vh-6rem)] w-full max-w-sm shrink-0 overflow-y-auto rounded-xl border border-slate-200 bg-white p-4 shadow"
      ></aside>
    </div>

    <div id="modalPat" class="hidden"></div>
    <div id="modalArchive" class="hidden"></div>
    <div id="modalEditor"></div>
    <div id="toastHost"></div>

    <script type="module" src="./app.js"></script>
    <footer class="border-t border-slate-200 py-10 text-center text-xs text-slate-400">
      Pimsie Supreme · Tick Board · see <code>tick-board/README.md</code>
    </footer>
  </body>
</html>
